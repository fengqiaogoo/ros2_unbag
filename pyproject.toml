[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2-unbag"
version = "1.3.0"
description = "A ROS 2 tool for exporting bags to human readable files"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "tqdm",
]

[project.scripts]
ros2-unbag = "ros2_unbag.export:main"
